name: wheels

on:
  workflow_dispatch:

jobs:
  build-local:
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-2019
        python: ['3.11']
        torch_version: ['2.9.1']
        cuda_short_version: ['128','130']

    uses: ./.github/workflows/wheels_build.yml
    with:
      os: ${{ matrix.os }}
      python: ${{ matrix.python }}
      torch_version: ${{ matrix.torch_version }}
      cuda_short_version: ${{ matrix.cuda_short_version }}

  consolidate-wheels:
    needs: [build-local]  # ← 移除了 build-pypi
    runs-on: windows-2019  # ← 改为 Windows runner，避免隐式 Linux 使用
    steps:
      - name: Download all wheel artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Consolidate wheels into a single folder
        shell: bash
        run: |
          mkdir -p consolidated_wheels
          find dist -name '*.whl' -exec cp {} consolidated_wheels/ \;
          ls -l consolidated_wheels

      - name: Upload consolidated wheels
        uses: actions/upload-artifact@v4
        with:
          name: built-wheels
          path: consolidated_wheels
